<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Error | MotoService{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #212529; }
    main { display: grid; min-height: 100vh; place-items: center; padding: 1.5rem; }
    section { max-width: 34rem; padding: 2.5rem; text-align: center; background: #fff; border: 1px solid #dee2e6; border-radius: 1rem; box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .08); }
    .code { margin: 0 0 .5rem; color: #0d6efd; font-size: 1rem; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    p { margin: 0 0 1.5rem; color: #5c636a; line-height: 1.5; }
    a { display: inline-block; padding: .75rem 1rem; color: #fff; text-decoration: none; background: #0d6efd; border-radius: .5rem; font-weight: 600; }
    a:focus-visible { outline: .2rem solid #86b7fe; outline-offset: .2rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="code">{% block code %}{% endblock %}</div>
      <h1>{% block heading %}{% endblock %}</h1>
      <p>{% block message %}{% endblock %}</p>
      <a href="/">Volver al inicio</a>
    </section>
  </main>
</body>
</html>
