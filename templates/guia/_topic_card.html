<div class="col-12 col-md-6 col-xl-4" data-guide-topic data-guide-keywords="{{ tema.titulo }} {{ tema.descripcion }} {{ tema.keywords }}">
  <a class="card interactive-card guide-topic h-100 p-4 text-decoration-none" href="{% url 'core:guia_tema' tema.slug %}">
    <span class="section-icon mb-3">{% include "shared/icon.html" with name=tema.icono %}</span>
    <h2 class="h5 fw-bold">{{ tema.titulo }}</h2>
    <p class="text-secondary">{{ tema.descripcion }}</p>
    <span class="d-flex align-items-center justify-content-between mt-auto fw-semibold">Ver guía {% include "shared/icon.html" with name="chevron-right" %}</span>
  </a>
</div>
