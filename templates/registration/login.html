{% extends "base.html" %}

{% block title %}Ingresar | MotoService{% endblock %}

{% block content %}
<div class="login-wrap mx-auto">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 fw-bold mb-2">Ingresar</h1>
      <p class="text-secondary mb-4">Acceso privado al panel del taller.</p>

      {% if form.errors %}
        <div class="alert alert-danger" role="alert">
          Usuario o contraseña incorrectos.
        </div>
      {% endif %}

      <form method="post" novalidate>
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
          <input class="form-control form-control-lg" type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
          <input class="form-control form-control-lg" type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
